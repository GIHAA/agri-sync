name: Hyperledger Service - Test

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Debug Directory Structure
      - name: Debug Directory Structure
        run: |
          echo "Printing directory structure..."
          ls -R

      # Step 3: Install Hyperledger Fabric Binaries
            # Step 3: Install Hyperledger Fabric Binaries
      - name: Install Hyperledger Fabric Binaries
        run: |
          echo "Installing Hyperledger Fabric binaries..."
          
          # Download Fabric binaries (ensure you're getting the correct version)
          curl -sSL https://bit.ly/2ysbOFE | bash -s -- 2.5.9  # Fabric version 2.5.9
          
          # Dynamically locate the 'bin' directory
          export FABRIC_BIN_PATH=$(find $PWD -type d -name 'bin' | head -n 1)
          if [ -z "$FABRIC_BIN_PATH" ]; then
            echo "Error: Fabric binaries directory not found."
            exit 1
          fi
          export PATH=$FABRIC_BIN_PATH:$PATH  # Ensure binaries are in PATH
          
          # Check if binaries are installed correctly
          echo "Checking Fabric binaries..."
          ls -l $FABRIC_BIN_PATH  # List the files in the bin directory
          peer version || echo "Peer command not found!"
          
          echo "Fabric binaries installed successfully."
          echo "Fabric version:"
          peer version || echo "Peer command not found!"

      # Step 4: Install Dependencies
      - name: Install Dependencies
        working-directory: back-end/hyperledger-service/asset-transfer-basic/rest-api-typescript
        run: |
          npm install
          npm install -g mocha chai hyperledger/fabric-sdk-node
          npx prettier --write src/server.ts

      # Step 5: Generate Environment Variables
      - name: Generate Environment Variables
        working-directory: back-end/hyperledger-service/asset-transfer-basic/rest-api-typescript
        run: |
          chmod +x ./scripts/generateEnv.sh
          npm run generateEnv

      # Step 6: Set Up Hyperledger Fabric Network
      - name: Set Up Hyperledger Fabric Network
        working-directory: back-end/hyperledger-service/test-network
        run: |
          chmod +x network.sh organizations/ccp-generate.sh
          export PATH=${PWD}/../bin:$PATH
          export FABRIC_CFG_PATH=$PWD/../config/
          ./network.sh down
          ./network.sh up createChannel -c seedtransectionchannel -ca
          ./network.sh deployCC -ccn basic -ccp ../asset-transfer-basic/chaincode-typescript/ -ccl typescript
          ./organizations/ccp-generate.sh

      # Step 7: Package and Install Chaincode
      - name: Package and Install Chaincode
        working-directory: back-end/hyperledger-service/test-network
        run: |
          export PATH=${PWD}/../bin:$PATH
          export FABRIC_CFG_PATH=$PWD/../config/
          peer lifecycle chaincode package basic.tar.gz --path ../asset-transfer-basic/chaincode-typescript/ --lang node --label basic_1.0
          peer lifecycle chaincode queryinstalled

      # Step 8: Start Hyperledger REST Service
      - name: Start Hyperledger REST Service
        working-directory: back-end/hyperledger-service/asset-transfer-basic/rest-api-typescript
        run: |
          export REDIS_PASSWORD=$(uuidgen)
          npm run start:redis
          npm run start:dev &
          sleep 30

      # Step 9: Run Hyperledger Tests
      - name: Run Hyperledger Tests
        working-directory: back-end/hyperledger-service/asset-transfer-basic/rest-api-typescript
        run: |
          mocha tests --recursive > test-results.txt 2>&1

      # Step 10: Process Test Results
      - name: Process Test Results
        id: test-results
        run: |
          if grep -q "passing" back-end/hyperledger-service/asset-transfer-basic/rest-api-typescript/test-results.txt; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "tests_passed=true" >> $GITHUB_OUTPUT
            echo "total_tests=$(grep -o "passing" back-end/hyperledger-service/asset-transfer-basic/rest-api-typescript/test-results.txt | wc -l)" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "tests_passed=false" >> $GITHUB_OUTPUT
          fi

      # Step 11: Comment on PR with Test Results
      - name: Comment PR
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('back-end/hyperledger-service/asset-transfer-basic/rest-api-typescript/test-results.txt', 'utf8');
            const testsPassed = '${{ steps.test-results.outputs.tests_passed }}' === 'true';
            const totalTests = '${{ steps.test-results.outputs.total_tests }}';
            const header = testsPassed 
              ? '### ✅ All Tests Passed! 🎉\n\n' +
                `${totalTests} tests completed successfully ⭐\n\n`
              : '### ❌ Tests Failed\n\n';
            
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `${header}\`\`\`\n${results}\n\`\`\``
            });

      # Step 12: Teardown Hyperledger Fabric Network
      - name: Teardown Hyperledger Fabric Network
        working-directory: back-end/hyperledger-service/test-network
        run: |
          ./network.sh down

      # Step 13: Additional Invocations and Queries
      - name: Perform Additional Chaincode Operations
        working-directory: back-end/hyperledger-service/test-network
        run: |
          export CORE_PEER_TLS_ENABLED=true
          export CORE_PEER_LOCALMSPID=Org1MSP
          export CORE_PEER_TLS_ROOTCERT_FILE=${PWD}/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt
          export CORE_PEER_MSPCONFIGPATH=${PWD}/organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp
          export CORE_PEER_ADDRESS=localhost:7051

          export CORE_PEER_LOCALMSPID=Org2MSP
          export CORE_PEER_TLS_ROOTCERT_FILE=${PWD}/organizations/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls/ca.crt
          export CORE_PEER_MSPCONFIGPATH=${PWD}/organizations/peerOrganizations/org2.example.com/users/Admin@org2.example.com/msp
          export CORE_PEER_ADDRESS=localhost:9051

          peer chaincode invoke -o localhost:7050 --ordererTLSHostnameOverride orderer.example.com --tls --cafile "${PWD}/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp/tlscacerts/tlsca.example.com-cert.pem" -C seedtransectionchannel -n basic --peerAddresses localhost:7051 --tlsRootCertFiles "${PWD}/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt" --peerAddresses localhost:9051 --tlsRootCertFiles "${PWD}/organizations/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls/ca.crt" -c '{"function":"InitLedger","Args":[]}'

          peer chaincode query -C seedtransectionchannel -n basic -c '{"Args":["GetAllSeeds"]}'

          peer chaincode query -C seedtransectionchannel -n basic -c '{"Args":["GetSeedHistory","farmer2","Corn"]}'
