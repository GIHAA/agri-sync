name: Hyperledger Fabric - Build and Deploy

on:
  push:
    branches:
      - develop
      - 'release-*'
  pull_request:
    branches: [develop]
    types: [opened, synchronize]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Extract branch name and set Docker tag
      - name: Extract branch name and set tag
        run: |
          if [[ ${{ github.ref }} == refs/heads/develop ]]; then
            echo "DOCKER_TAG=dev" >> $GITHUB_ENV
          elif [[ ${{ github.ref }} =~ refs/heads/release-(.*) ]]; then
            echo "DOCKER_TAG=${BASH_REMATCH[1]}" >> $GITHUB_ENV
          else
            echo "DOCKER_TAG=pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          fi

      # Step 5: Build and push Peer0.Org1 Docker image
      - name: Build and push Peer0.Org1 Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./peer0.org1.example.com
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hyperledger-peer0-org1:${{ env.DOCKER_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hyperledger-peer0-org1:latest

      # Step 6: Build and push Peer0.Org2 Docker image
      - name: Build and push Peer0.Org2 Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./peer0.org2.example.com
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hyperledger-peer0-org2:${{ env.DOCKER_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hyperledger-peer0-org2:latest

      # Step 7: Build and push Redis Docker image
      - name: Build and push Redis Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./redis
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hyperledger-redis:${{ env.DOCKER_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hyperledger-redis:latest

      # Step 8: Build and push NodeApp Docker image
      - name: Build and push NodeApp Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./nodeapp
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hyperledger-nodeapp:${{ env.DOCKER_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hyperledger-nodeapp:latest
