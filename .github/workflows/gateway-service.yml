name: Gateway Service - Build and Deploy

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize]
  push:
    branches:
      - develop
      - 'release-*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract branch name and set tag
        run: |
          if [[ ${{ github.ref }} == refs/heads/develop ]]; then
            echo "DOCKER_TAG=dev" >> $GITHUB_ENV
          elif [[ ${{ github.ref }} =~ refs/heads/release-(.*) ]]; then
            echo "DOCKER_TAG=${BASH_REMATCH[1]}" >> $GITHUB_ENV
          else
            echo "DOCKER_TAG=pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          fi
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./back-end/gateway
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/as-gateway:${{ env.DOCKER_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/as-gateway:latest