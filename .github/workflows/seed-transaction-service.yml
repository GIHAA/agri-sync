name: Seed Transaction Service - Test and Deploy

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize]
  push:
    branches:
      - develop
      - 'release-*'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    services:
      postgres:
        image: "postgres:16.0"
        ports:
          - "5436:5432"
        env:
          POSTGRES_USER: transaction_db
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: transaction_service
        options: --health-cmd="pg_isready -U transaction_db" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Dependencies
        working-directory: back-end/seed-transaction-service
        run: npm ci

      - name: Run Tests
        working-directory: back-end/seed-transaction-service
        run: npm test -- --ci --verbose --reporters=default --reporters=jest-junit

      - name: Debug Test Results
        run: cat back-end/seed-transaction-service/junit.xml || true

      - name: Process Test Results
        id: test-results
        run: |
          set -e
          if grep -q "<failure" back-end/seed-transaction-service/junit.xml; then
            echo "status=partial_failure" >> $GITHUB_OUTPUT
            echo "tests_passed=false" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
            echo "tests_passed=true" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR (if pull request)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('back-end/seed-transaction-service/junit.xml', 'utf8');

            const testsPassed = '${{ steps.test-results.outputs.tests_passed }}' === 'true';
            const message = testsPassed
              ? '### ✅ All Tests Passed! 🎉\nAll tests completed successfully. ⭐\n'
              : '### ⚠️ Some Tests Failed\nSome tests failed, but CI/CD will continue.\n';

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: message
            });

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Branch Name and Set Docker Tag
        run: |
          if [[ ${{ github.ref }} == refs/heads/develop ]]; then
            echo "DOCKER_TAG=dev" >> $GITHUB_ENV
          elif [[ ${{ github.ref }} =~ refs/heads/release-(.*) ]]; then
            echo "DOCKER_TAG=${BASH_REMATCH[1]}" >> $GITHUB_ENV
          else
            echo "DOCKER_TAG=pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./back-end/seed-transaction-service
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/seed-transaction-service:${{ env.DOCKER_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/seed-transaction-service:latest
